# Integração contínua: roda em todo push para a main e em todo pull request.
# Confere o mesmo que o professor mede (seção 1.2 de AVALIACAO): testes,
# formatação do Elm, Prolog sem avisos e Elm compilando.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar SWI-Prolog (PPA oficial, versão recente)
        run: |
          sudo add-apt-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Instalar dependências
        run: make install

      - name: Prolog sem avisos e Elm formatado
        run: make lint

      - name: Testes
        run: make test

      - name: Elm compila
        run: make build
