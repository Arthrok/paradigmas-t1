# Integração contínua: roda em todo push para a main e em todo pull request.
# Confere o mesmo que o professor mede (seção 1.2 de AVALIACAO): testes,
# formatação do Elm, Prolog sem avisos e Elm compilando.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    # Versão fixa: o PPA do SWI-Prolog publica pacotes para o 24.04. Em
    # versões mais novas do Ubuntu vem o SWI-Prolog 9.2 do próprio sistema,
    # cujo cabeçalho C não compila o janus com o GCC atual.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar SWI-Prolog (PPA oficial, versão recente)
        run: |
          set -e
          for tentativa in 1 2 3 4 5; do
            echo "Tentativa ${tentativa}/5 de instalar SWI-Prolog"
            if sudo add-apt-repository -y ppa:swi-prolog/stable &&
               sudo apt-get update &&
               sudo apt-get install -y swi-prolog-nox; then
              break
            fi
            if [ "${tentativa}" -eq 5 ]; then
              exit 1
            fi
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sleep 30
          done
          swipl --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Instalar dependências
        run: make install

      - name: Prolog sem avisos e Elm formatado
        run: make lint

      - name: Testes
        run: make test

      - name: Elm compila
        run: make build
